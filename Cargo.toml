[package]
name = "auto-discovery"
version = "0.2.1"
edition = "2024"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "A general-purpose network and system service discovery library for Rust applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/auto-discovery"
keywords = ["network", "discovery", "mdns", "service", "upnp"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[features]
default = ["dns-sd", "mdns-sd", "upnp"]
# Removed in 0.3.0 (they enabled only dependencies nothing compiled used, or
# a backend that never built): `mdns`, `simple-mdns`, `basic-mdns`,
# `metrics`, `testing`. `secure` keeps only `ring`, the one it uses.
secure = ["dep:ring"]
# Gates the DNS-SD module, which is still a stub ("not yet implemented").
dns-sd = []
mdns-sd = ["dep:mdns-sd"]
upnp = []

[dependencies]
tokio = { version = "1.0", features = ["full"] }
mdns-sd = { version = "0.13.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

# Security and verification
ring = { version = "0.17", optional = true }
base64 = "0.22"

# Production safety
governor = "0.10"

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports", "async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"

[workspace]
members = []
resolver = "2"

[[bench]]
name = "discovery_benchmarks"
harness = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1
