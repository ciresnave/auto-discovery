[package]
name = "auto-discovery"
version = "0.3.2"
edition = "2024"
# Highest rust-version among locked dependencies (uuid 1.27); CI `msrv` job.
rust-version = "1.89"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "A general-purpose network and system service discovery library for Rust applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/auto-discovery"
keywords = ["network", "discovery", "mdns", "service", "upnp"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[features]
default = ["dns-sd", "mdns-sd", "upnp"]
# Removed in 0.3.0 (they enabled only dependencies nothing compiled used, or
# a backend that never built): `mdns`, `simple-mdns`, `basic-mdns`,
# `metrics`, `testing`. `secure` keeps only `ring`, the one it uses.
secure = ["dep:ring"]
# Gates the DNS-SD module, which is still a stub ("not yet implemented").
dns-sd = []
mdns-sd = ["dep:mdns-sd"]
upnp = []
# Test-only: runs the tests that bind mDNS/SSDP sockets. Off by default so a
# plain `cargo test` opens no sockets (each rebuilt test binary would raise
# a firewall prompt). CI enables it via --all-features.
network-tests = []

[dependencies]
tokio = { version = "1.53", features = ["full"] }
mdns-sd = { version = "0.21.4", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
uuid = { version = "1.27", features = ["v4", "serde"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }

# Security and verification
ring = { version = "0.17.14", optional = true }
base64 = "0.23.1"

# Production safety
governor = "0.10.4"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace]
members = []
resolver = "2"

[[test]]
name = "mdns_tests"
required-features = ["network-tests", "mdns-sd"]

[[test]]
name = "upnp_tests"
required-features = ["network-tests", "upnp"]

[[bench]]
name = "discovery_benchmarks"
harness = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1
